<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Ku</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#ffffff">
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; font-family: sans-serif; }
    iframe { width: 100%; height: 100%; border: none; }
    
    /* Desain Pop-up Install Otomatis */
    #install-popup {
      display: none; /* Disembunyikan awalnya */
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 9999;
      text-align: center;
      border: 1px solid #ddd;
    }
    #install-popup p {
      margin: 0 0 15px 0;
      font-size: 16px;
      color: #333;
      font-weight: bold;
    }
    #btn-install {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      margin-bottom: 10px;
      cursor: pointer;
    }
    #btn-close {
      background: none;
      border: none;
      color: #777;
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Link GAS Anda -->
  <iframe src="https://script.google.com/macros/s/AKfycbxbsw18EFULmVdtE7ubyPd5RG0emHvg3c69TeFZnl2l3380kAhyskGUvrs3NOhHhj0org/exec" allow="camera; microphone; geolocation"></iframe>
  
  <!-- Kotak Pop-up Install -->
  <div id="install-popup">
    <p>Install Aplikasi Ini di HP Anda 🚀</p>
    <button id="btn-install">Install Sekarang</button>
    <button id="btn-close">Nanti Saja</button>
  </div>

  <script>
    // 1. Mendaftarkan Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    // 2. Logika Pop-up Install Otomatis
    let deferredPrompt;
    const installPopup = document.getElementById('install-popup');
    const btnInstall = document.getElementById('btn-install');
    const btnClose = document.getElementById('btn-close');

    // Menangkap event instalasi bawaan browser
    window.addEventListener('beforeinstallprompt', (e) => {
      // Mencegah mini-infobar bawaan Chrome muncul
      e.preventDefault();
      // Menyimpan event untuk dipanggil nanti
      deferredPrompt = e;
      // Menampilkan pop-up custom buatan kita
      installPopup.style.display = 'block';
    });

    // Jika tombol "Install Sekarang" diklik
    btnInstall.addEventListener('click', async () => {
      // Sembunyikan pop-up kita
      installPopup.style.display = 'none';
      // Munculkan pop-up instalasi resmi dari sistem
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`Hasil install: ${outcome}`);
        deferredPrompt = null; // Reset
      }
    });

    // Jika tombol "Nanti Saja" diklik
    btnClose.addEventListener('click', () => {
      installPopup.style.display = 'none';
    });
  </script>
</body>
</html>
